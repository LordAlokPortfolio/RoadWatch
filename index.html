<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RoadWatch — Ontario Wildlife Collision Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; }
  #map { width: 100%; height: 100%; }
  .rw-popup button {
    margin-top: 6px; padding: 6px 10px; border: none; border-radius: 4px;
    background: #2e7d32; color: white; cursor: pointer; font-size: 13px;
  }
  .rw-status-removed { color: #2e7d32; font-weight: 600; }
  .rw-status-reported { color: #d32f2f; font-weight: 600; }
  #rw-permission-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    background: #222; color: white; padding: 10px 16px; font-size: 14px;
    display: flex; justify-content: space-between; align-items: center;
  }
  #rw-permission-bar button {
    padding: 6px 12px; border: none; border-radius: 4px;
    background: #2e7d32; color: white; cursor: pointer;
  }
  #rw-banner {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1001;
    background: #d32f2f; color: white; padding: 12px 16px; font-size: 15px;
    text-align: center; display: none;
  }
</style>
</head>
<body>
<div id="rw-permission-bar" style="display:none;">
  <span>Enable notifications for new reports</span>
  <button onclick="requestNotifyPermission()">Enable</button>
</div>
<div id="rw-banner"></div>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  const API_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

  const map = L.map('map').setView([43.65, -79.66], 10); // GTA default
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  let markers = [];
  let seenIds = new Set();
  let firstLoad = true;

  function clearMarkers() {
    markers.forEach(m => map.removeLayer(m));
    markers = [];
  }

  function requestNotifyPermission() {
    Notification.requestPermission().then(updatePermissionBar);
  }

  function updatePermissionBar() {
    const bar = document.getElementById('rw-permission-bar');
    if (!('Notification' in window) || Notification.permission !== 'default') {
      bar.style.display = 'none';
    } else {
      bar.style.display = 'flex';
    }
  }

  function showBanner(text) {
    const banner = document.getElementById('rw-banner');
    banner.textContent = text;
    banner.style.display = 'block';
    setTimeout(() => banner.style.display = 'none', 8000);
  }

  function notifyNewReport(r) {
    const mapsLink = `https://www.google.com/maps?q=${r.lat},${r.lng}`;
    if ('Notification' in window && Notification.permission === 'granted') {
      const n = new Notification(`RoadWatch: ${r.animal} reported`, {
        body: 'Tap for directions'
      });
      n.onclick = () => window.open(mapsLink, '_blank');
    }
    showBanner(`New report: ${r.animal} — check the map`);
  }

  function markRemoved(id) {
    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "markRemoved", id })
    }).then(() => loadReports());
  }

  function loadReports() {
    fetch(API_URL + "?action=list")
      .then(r => r.json())
      .then(reports => {
        clearMarkers();
        const bounds = [];
        reports.forEach(r => {
          const color = r.status === "removed" ? "#2e7d32" : "#d32f2f";
          const marker = L.circleMarker([r.lat, r.lng], {
            radius: 8, color: color, fillColor: color, fillOpacity: 0.8
          }).addTo(map);

          const statusClass = r.status === "removed" ? "rw-status-removed" : "rw-status-reported";
          const mapsLink = `https://www.google.com/maps?q=${r.lat},${r.lng}`;
          let popupHtml = `<div class="rw-popup">
            <strong>${r.animal}</strong><br>
            ${new Date(r.timestamp).toLocaleString()}<br>
            Status: <span class="${statusClass}">${r.status}</span><br>
            <a href="${mapsLink}" target="_blank">Directions</a>`;
          if (r.status !== "removed") {
            popupHtml += `<br><button onclick="markRemoved('${r.id}')">Mark Removed</button>`;
          }
          popupHtml += `</div>`;

          marker.bindPopup(popupHtml);
          markers.push(marker);
          bounds.push([r.lat, r.lng]);

          if (!firstLoad && r.status === "reported" && !seenIds.has(r.id)) {
            notifyNewReport(r);
          }
          seenIds.add(r.id);
        });
        firstLoad = false;
        if (bounds.length > 0) map.fitBounds(bounds, { padding: [30, 30] });
      });
  }

  updatePermissionBar();
  loadReports();
  setInterval(loadReports, 20000);
</script>
</body>
</html>
